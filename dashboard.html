<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Larizinha Store</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard-container {
      max-width: 800px;
      width: 100%;
      margin: 20px;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary-color);
      color: #fff;
      padding: 20px;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
    }
    .dashboard-header h1 {
      font-size: 1.5em;
    }
    .dashboard-content {
      background: var(--card-light);
      border-radius: 0 0 var(--border-radius) var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 30px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .menu-item {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #e0e0e0;
    }
    .menu-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .menu-item i {
      font-size: 2em;
      margin-bottom: 10px;
      color: var(--primary-color);
    }
    .menu-item span {
      font-weight: bold;
    }
  </style>
</head>
<body class="dashboard-page">
  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1>💠 Painel do Cliente</h1>
      <button id="logoutBtn" class="btn-outline">Sair</button>
    </div>
    <div class="dashboard-content">
      <p>Bem-vindo, <span id="userName">Cliente</span>!</p>
      <p>Seu saldo de afiliado: R$ <span id="affiliateBalance">0,00</span></p>
      
      <div class="menu-grid">
        <div class="menu-item" id="bankMenu">
          <i>🏦</i><br>
          <span>Conta Bancária</span>
        </div>
        <div class="menu-item" id="withdrawMenu">
          <i>💸</i><br>
          <span>Solicitar Saque</span>
        </div>
        <div class="menu-item" id="historyMenu">
          <i>📊</i><br>
          <span>Histórico</span>
        </div>
        <div class="menu-item" id="termsMenu">
          <i>📜</i><br>
          <span>Termos de Uso</span>
        </div>
      </div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
